spring.application.name=authservicems
jwt.secret-base64=${JWT_SECRET_BASE64}
jwt.issuer=http://localhost:8081
jwt.access-token-minutes=15



# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Spring Boot application will run
server.port=8081

# Base context path for all APIs (optional)
# Example: http://localhost:8080/api/customers
# server.servlet.context-path=/api


# =========================================================
# H2 DATABASE CONFIGURATION
# =========================================================

# H2 in-memory database
# The database will be created when the application starts
# and will be removed when the application stops.
spring.datasource.url=jdbc:h2:file:./data/authDb

# H2 database username
spring.datasource.username=sa

# H2 database password
spring.datasource.password=

# H2 JDBC driver
spring.datasource.driver-class-name=org.h2.Driver


# =========================================================
# H2 CONSOLE CONFIGURATION
# =========================================================

# Enable H2 browser console
spring.h2.console.enabled=true

# URL path for H2 console
# Open: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# Allows H2 console to work with Spring Security
# only if your security configuration permits it.
# spring.h2.console.settings.web-allow-others=true


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Automatically create/update database tables
#
# update  -> Creates missing tables and updates schema
# create  -> Drops and recreates tables every startup
# create-drop -> Creates tables at startup and drops at shutdown
# validate -> Only validates existing schema
# none -> No automatic schema modification
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Optional: show SQL parameters
# spring.jpa.properties.hibernate.highlight_sql=true

logging.level.org.springframework.security=TRACE
